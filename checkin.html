<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d6a9e">
<title>רישום נוכחות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="gh.js"></script>
<style>
:root{--ink:#15314a;--muted:#5d7387;--brand:#1d6a9e;--line:#d6e2ec;--ok:#2a9d8f;--no:#d1495b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,Arial,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#e3f0f9,#eef7f2);line-height:1.45}
button,input,select{font:inherit}
.wrap{max-width:460px;margin:0 auto;padding:18px 14px 40px;display:flex;flex-direction:column;gap:14px}
.hero{background:linear-gradient(110deg,#1d6a9e,#0f4c78);color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 18px rgba(15,76,120,.25)}
.hero h1{font-size:21px}
.hero .sub{opacity:.85;font-size:14px}
.hero .clk{font-size:30px;font-weight:800;direction:ltr}
.card{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:500}
input,select{border:1px solid var(--line);border-radius:12px;padding:13px 12px;font-size:17px;color:var(--ink);background:#fff;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shifts{display:flex;gap:6px;flex-wrap:wrap}
.shifts button{flex:1;border:1px solid var(--line);background:#f3f8fb;border-radius:12px;padding:9px 4px;cursor:pointer;color:var(--ink);font-size:14px;line-height:1.2}
.shifts button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.shifts small{display:block;opacity:.75;font-size:12px;direction:ltr}
.btn{border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:800;color:#fff;background:var(--ok);cursor:pointer;width:100%}
.btn.no{background:#fff;color:var(--no);border:2px solid #f2c5cc;font-size:16px;padding:11px}
.btn:disabled{opacity:.55}
.err{color:var(--no);font-size:14px;min-height:18px}
.list{display:flex;flex-direction:column;gap:8px}
.p{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#f3f8fb}
.p.me{background:#e4f5f1}
.av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.p .tx{flex:1;min-width:0}
.p .tx b{display:block}
.p .tx span{font-size:13px;color:var(--muted)}
.p button{border:0;background:none;color:var(--no);font-size:13px;cursor:pointer}
.meta{font-size:13px;color:var(--muted)}
.done{position:fixed;inset:0;background:rgba(21,49,74,.55);display:flex;align-items:center;justify-content:center;z-index:9;opacity:0;pointer-events:none;transition:.3s}
.done.on{opacity:1;pointer-events:auto}
.done div{background:#fff;border-radius:22px;padding:28px 30px;text-align:center;transform:scale(.8);transition:.35s cubic-bezier(.2,1.4,.4,1)}
.done.on div{transform:none}
.done .ic{font-size:64px;line-height:1}
.done b{display:block;font-size:22px;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div><h1>רישום נוכחות</h1><div class="sub" id="ward">לוח המחלקה</div></div><div class="clk" id="clk"></div></div>

  <div class="card" id="lock" hidden>
    <label>קוד צוות<input id="code" type="password" autocomplete="current-password"></label>
    <button class="btn" id="unlock" style="background:var(--brand)">כניסה</button>
    <div class="err" id="lerr"></div>
  </div>

  <form class="card" id="f" hidden>
    <label>השם שלך (כפי שיופיע בטלוויזיה)<input id="name" list="names" autocomplete="name" required></label>
    <datalist id="names"></datalist>
    <div class="grid2" id="trn"><label>🌐 الاسم بالعربية (לא חובה)<input id="name_ar" dir="rtl"></label><label>🌐 Name in English (לא חובה)<input id="name_en" dir="ltr"></label></div>
    <label>תפקיד<select id="role"></select></label>
    <label>תאריך<input type="date" id="date"></label>
    <div class="shifts" id="shifts"></div>
    <div class="grid2"><label>משעה<input type="time" id="from" required></label><label>עד שעה<input type="time" id="to" required></label></div>
    <button class="btn" type="submit" id="go">✔ אני במחלקה</button>
    <button class="btn no" type="button" id="absent">לא מגיע/ה בתאריך הזה</button>
    <div class="err" id="ferr"></div>
  </form>

  <div class="card" id="today" hidden><b id="ttl">מי במחלקה היום</b><div class="list" id="list"></div></div>
  <div class="meta" id="demo" style="text-align:center"></div>
</div>
<div class="done" id="done"><div><div class="ic" id="dic">✅</div><b id="dtx">נרשמת!</b><div class="meta">יופיע בטלוויזיה תוך כדקה</div></div></div>

<script>
const W=window.WardGH,ymd=W.ymd;
const ROLES=['אח/ות','אח/ות אחראי/ת','רופא/ה','מנהל/ת המחלקה','מזכיר/ה','ריפוי בעיסוק','עובד/ת סוציאלי/ת','פסיכולוג/ית','כוח עזר','סטודנט/ית','מתנדב/ת','אחר'];
const SHIFTS=[['בוקר','07:00','15:00'],['ערב','15:00','23:00'],['לילה','23:00','07:00']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const norm=s=>String(s||'').trim().replace(/\s+/g,' ');
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
let ITEMS=[],BUSY=false;

setInterval(()=>{const d=new Date();$('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');},1000);
$('role').innerHTML=ROLES.map(r=>`<option>${r}</option>`).join('');
$('shifts').innerHTML=SHIFTS.map(([n,a,b])=>`<button type="button" data-a="${a}" data-b="${b}">${n}<small>${a}–${b}</small></button>`).join('');
$('shifts').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('from').value=b.dataset.a;$('to').value=b.dataset.b;markShift();};
['from','to'].forEach(id=>$(id).oninput=markShift);
function markShift(){document.querySelectorAll('#shifts button').forEach(b=>b.classList.toggle('on',b.dataset.a===$('from').value&&b.dataset.b===$('to').value));}
$('date').value=ymd(new Date());
$('date').onchange=renderList;

const staffList=()=>ITEMS.filter(i=>i.type==='staff'&&i.active!==false);
const findStaff=n=>staffList().find(s=>norm(s.name)===norm(n));
$('name').addEventListener('change',()=>{
  const s=findStaff($('name').value);$('trn').style.display=s?'none':'';
  if(s){$('role').value=ROLES.includes(s.role)?s.role:'אחר';if(s.from&&!$('from').value){$('from').value=s.from;$('to').value=s.to||'';markShift();}}
});

function present(date){
  const d=new Date(date+'T12:00'),dow=d.getDay();
  const att=ITEMS.filter(a=>a.type==='attendance'&&a.date===date);
  const out=[];
  staffList().forEach(s=>{
    const a=att.find(x=>x.staffId===s.id);
    const on=a?a.status==='in':(s.days||[]).map(Number).includes(dow);
    if(on)out.push({name:s.name,role:s.role,from:(a&&a.from)||s.from,to:(a&&a.to)||s.to,id:a&&a.id});
  });
  att.filter(a=>!a.staffId&&a.status==='in').forEach(a=>out.push({name:a.name,role:a.role,from:a.from,to:a.to,id:a.id}));
  return out.sort((a,b)=>String(a.from||'').localeCompare(String(b.from||'')));
}
function renderList(){
  const date=$('date').value||ymd(new Date()),me=norm(ls.get('ci-name'));
  const p=present(date);
  $('ttl').textContent=date===ymd(new Date())?`מי במחלקה היום (${p.length})`:`רשומים ל-${date.split('-').reverse().join('/')} (${p.length})`;
  $('list').innerHTML=p.map(x=>`<div class="p${norm(x.name)===me?' me':''}"><div class="av" style="background:hsl(${hue(x.name)},55%,48%)">${esc(norm(x.name).replace(/^(ד["״]ר)\s*/,'').charAt(0))}</div>
    <div class="tx"><b>${esc(x.name)}</b><span>${esc(x.role||'')}${x.from?' · '+esc(x.from)+'–'+esc(x.to||''):''}</span></div>
    ${x.id&&norm(x.name)===me?`<button data-del="${esc(x.id)}">ביטול</button>`:''}</div>`).join('')||'<div class="meta">עוד אף אחד לא נרשם</div>';
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>act(()=>W.del(b.dataset.del,'ביטול נוכחות'),'🗑️','הרישום בוטל'));
}

async function act(fn,ic,tx){
  if(BUSY)return;BUSY=true;$('go').disabled=$('absent').disabled=true;$('ferr').textContent='';
  try{ITEMS=await fn();renderList();$('dic').textContent=ic;$('dtx').textContent=tx;$('done').classList.add('on');setTimeout(()=>$('done').classList.remove('on'),1800);}
  catch(e){$('ferr').textContent='לא נשמר: '+e;}
  finally{BUSY=false;$('go').disabled=$('absent').disabled=false;}
}
function entry(status){
  const name=norm($('name').value),date=$('date').value||ymd(new Date());
  if(!name)throw 'נא לכתוב שם';
  ls.set('ci-name',name);ls.set('ci-role',$('role').value);ls.set('ci-name-ar',$('name_ar').value.trim());ls.set('ci-name-en',$('name_en').value.trim());W.setWho(name);
  const s=findStaff(name);
  const base={type:'attendance',date,status,name,name_ar:$('name_ar').value.trim(),name_en:$('name_en').value.trim(),role:$('role').value,from:$('from').value,to:$('to').value};
  if(s)return Object.assign(base,{id:`att_${date}_${s.id}`,staffId:s.id,name:s.name});
  return Object.assign(base,{id:`att_${date}_n_${name.replace(/\s+/g,'_')}`});
}
$('f').onsubmit=e=>{e.preventDefault();
  try{if(!$('from').value||!$('to').value)throw 'נא לבחור משעה ועד שעה';const it=entry('in');act(()=>W.save(it,'נוכחות'),'✅',`תודה ${it.name}!`);}
  catch(err){$('ferr').textContent=err;}
};
$('absent').onclick=()=>{
  try{const it=entry('out');
    if(!it.staffId){const ex=ITEMS.find(x=>x.id===it.id);if(!ex){$('ferr').textContent='אין רישום שלך לתאריך הזה';return;}return act(()=>W.del(it.id,'ביטול נוכחות'),'🗑️','הרישום בוטל');}
    act(()=>W.save(it,'היעדרות'),'👋','עודכן – לא תופיע/י במסך');}
  catch(err){$('ferr').textContent=err;}
};

async function openApp(code){
  await W.unlock(code);
  ITEMS=await W.load();
  const st=ITEMS.find(i=>i.type==='settings');if(st&&st.wardName)$('ward').textContent=st.wardName;
  $('names').innerHTML=staffList().map(s=>`<option value="${esc(s.name)}">`).join('');
  $('name').value=ls.get('ci-name')||'';$('name_ar').value=ls.get('ci-name-ar')||'';$('name_en').value=ls.get('ci-name-en')||'';
  if(ls.get('ci-role'))$('role').value=ls.get('ci-role');
  $('name').dispatchEvent(new Event('change'));
  $('lock').hidden=true;$('f').hidden=false;$('today').hidden=false;
  if(W.DEMO)$('demo').textContent='מצב הדגמה – הנתונים נשמרים רק במכשיר הזה';
  renderList();
}
async function boot(){
  const m=location.hash.match(/k=([^&]+)/),code=m?decodeURIComponent(m[1]):(ls.get('ci-code')||'');
  if(W.DEMO||code){
    try{await openApp(code);if(code)ls.set('ci-code',code);return;}
    catch(e){ls.del('ci-code');$('lerr').textContent=String(e);}
  }
  $('lock').hidden=false;
}
$('unlock').onclick=async()=>{
  $('lerr').textContent='בודק…';
  try{await openApp($('code').value);ls.set('ci-code',$('code').value);$('lerr').textContent='';}
  catch(e){$('lerr').textContent=String(e);}
};
$('code').onkeydown=e=>{if(e.key==='Enter')$('unlock').click();};
boot();
setInterval(()=>{if(!$('f').hidden&&!BUSY)W.load().then(x=>{ITEMS=x;renderList();}).catch(()=>{});},90000);
</script>
</body>
</html>
