<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לוח המחלקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Noto+Sans+Arabic:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --u:min(1vw,1.78vh);
  --ink:#14304a;--muted:#5b7186;--brand:#1d6a9e;--brand2:#0f4c78;--panel:rgba(255,255,255,.88);--soft:rgba(232,242,249,.9);
  --accent:#e2703a;--now:#fff4e8;
  --meal:#2a9d8f;--med:#d1495b;--activity:#1d6a9e;--group:#7b5ea7;--ot:#c0841a;--visit:#e2703a;--rest:#56677a;--other:#5d7387;
  --bg1:#e3f0f9;--bg2:#eef7f2;--blob1:#9fd0f0;--blob2:#a8e3cf;--blob3:#c9c2f0;
}
body[data-tod=morning]{--bg1:#fdf1df;--bg2:#e6f2f9;--blob1:#ffd59e;--blob2:#ffc2b0;--blob3:#a9d8f5}
body[data-tod=evening]{--bg1:#ebe5f7;--bg2:#e1eaf7;--blob1:#c7b5f0;--blob2:#f3b9cf;--blob3:#9dbcf0;--brand:#3a5a9e;--brand2:#2a3f78}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Heebo,'Noto Sans Arabic',Arial,sans-serif;font-size:calc(var(--u)*1.3);cursor:none;transition:background 3s}

/* ---------- רקע חי ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;border-radius:50%;opacity:.55;filter:blur(calc(var(--u)*4));will-change:transform}
.bg .b1{width:45vw;height:45vw;background:var(--blob1);top:-15vw;right:-10vw;animation:drift1 38s ease-in-out infinite alternate}
.bg .b2{width:38vw;height:38vw;background:var(--blob2);bottom:-18vw;left:-8vw;animation:drift2 44s ease-in-out infinite alternate}
.bg .b3{width:30vw;height:30vw;background:var(--blob3);top:35vh;left:35vw;animation:drift3 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-14vw,12vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(16vw,-14vh) scale(.9)}}
@keyframes drift3{to{transform:translate(-18vw,-20vh) scale(1.2)}}

.app{position:relative;z-index:1;display:grid;grid-template-rows:12vh 1fr 8.5vh;height:100vh;gap:1.4vh;padding:1.4vh 1.2vw}

/* ---------- כותרת ---------- */
header{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;color:#fff;border-radius:calc(var(--u)*1.4);padding:0 2.2vw;
  background:linear-gradient(100deg,var(--brand),var(--brand2),var(--brand),#2b88b8);background-size:300% 100%;animation:sheen 18s ease-in-out infinite alternate;box-shadow:0 .6vh 2vh rgba(15,60,100,.25)}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(100%);animation:shine 9s ease-in-out infinite}
@keyframes sheen{to{background-position:100% 0}}
@keyframes shine{0%,60%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.hdate .g{font-size:calc(var(--u)*2.1);font-weight:800}
.hdate .h{font-size:calc(var(--u)*1.55);opacity:.92;margin-top:.3vh}
.clock{font-size:calc(var(--u)*6);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.15vw;line-height:1;direction:ltr;text-shadow:0 .4vh 1.5vh rgba(0,0,0,.18)}
.clock .c{animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.hside{justify-self:end;text-align:end;font-size:calc(var(--u)*1.45);line-height:1.55}
.hside .wx{font-size:calc(var(--u)*2.1);font-weight:800}
.hside .wx span{display:inline-block;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.5vh) rotate(-6deg)}}

/* ---------- במה ---------- */
#stage{position:relative;min-height:0}
.view{position:absolute;inset:0;opacity:0;transform:translateY(2.5vh) scale(.985);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.view.on{opacity:1;transform:none}
.sbar{position:absolute;bottom:-1vh;left:2vw;right:2vw;height:.45vh;background:rgba(255,255,255,.5);border-radius:1vh;overflow:hidden;z-index:3}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--brand));border-radius:1vh}

.dash{display:grid;grid-template-columns:57fr 43fr;gap:1.2vw}
.card{background:var(--panel);border-radius:calc(var(--u)*1.4);padding:2vh 1.6vw;box-shadow:0 .5vh 2vh rgba(20,60,95,.09);display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
h2{font-size:calc(var(--u)*2.1);color:var(--brand);font-weight:800;margin-bottom:1.4vh;display:flex;align-items:center;gap:.8vw}
h2 small{font-size:calc(var(--u)*1.35);color:var(--muted);font-weight:500;margin-inline-start:auto}

/* סדר היום */
.sched{display:flex;flex-direction:column;gap:1vh;flex:1;min-height:0;overflow:hidden}
.row{--c:var(--other);flex:none;position:relative;overflow:hidden;display:grid;grid-template-columns:calc(var(--u)*9.5) 1fr auto;align-items:center;gap:1.2vw;padding:1.1vh 1.2vw;background:var(--soft);border-radius:calc(var(--u)*.9);border-inline-start:calc(var(--u)*.55) solid var(--c);font-size:calc(var(--u)*2.05)}
.row .t{font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.row .t small{display:block;font-size:calc(var(--u)*1.15);font-weight:500;color:var(--muted)}
.row .ti{font-weight:700}
.row .b{font-size:calc(var(--u)*1.4);font-weight:800;color:var(--accent);white-space:nowrap}
.row.past{opacity:.38}
.row.next{background:#fff;box-shadow:0 0 0 .22vw var(--c) inset}
.row.now{background:var(--now);box-shadow:0 0 0 .26vw var(--accent) inset;animation:glow 2.6s ease-in-out infinite}
.row.now::after{content:"";position:absolute;bottom:0;inset-inline-start:0;height:.55vh;width:var(--p,0%);background:var(--accent);opacity:.75;transition:width 2s}
.row.now .b{background:var(--accent);color:#fff;padding:.4vh .9vw;border-radius:2vw}
@keyframes glow{50%{box-shadow:0 0 0 .26vw var(--accent) inset,0 0 2.2vh rgba(226,112,58,.45)}}
.empty{color:var(--muted);font-size:calc(var(--u)*1.7);margin:auto;text-align:center}

/* כניסה מדורגת */
.anim>*{animation:rise .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(2.2vh)}}

/* כרטיס מתחלף */
.slide{position:absolute;inset:0;padding:2vh 1.6vw 4.5vh;opacity:0;transform:translateX(-3vw);transition:opacity .5s ease,transform .5s ease;display:flex;flex-direction:column}
.slide.on{opacity:1;transform:none;transition:opacity .8s ease .5s,transform .8s ease .5s}
.slide.out{transform:translateX(3vw)}
.dots{position:absolute;bottom:1.5vh;left:0;right:0;display:flex;justify-content:center;gap:.6vw}
.dots i{width:calc(var(--u)*.7);height:calc(var(--u)*.7);border-radius:50%;background:#c9d8e4;transition:.5s}
.dots i.on{background:var(--brand);width:calc(var(--u)*2);border-radius:1vw}
.kv{display:flex;flex-direction:column;gap:1.2vh;margin-bottom:1.6vh}
.box{background:var(--soft);border-radius:calc(var(--u)*.9);padding:1.3vh 1.2vw}
.box .l{font-size:calc(var(--u)*1.3);color:var(--muted)}
.box .v{font-size:calc(var(--u)*2.2);font-weight:800}
.list{display:flex;flex-direction:column;gap:1vh}
.li{display:flex;justify-content:space-between;align-items:center;gap:1vw;font-size:calc(var(--u)*1.9);padding:1vh 1.1vw;background:var(--soft);border-radius:calc(var(--u)*.9)}
.li b{font-weight:700}
.li span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:calc(var(--u)*1.6);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:.8vw}
.chip{background:var(--soft);border-radius:2vw;padding:.9vh 1.2vw;font-size:calc(var(--u)*1.65)}
.chip em{font-style:normal;color:var(--muted);font-size:calc(var(--u)*1.3)}
.msg{font-size:calc(var(--u)*2.1);line-height:1.45;padding:1.6vh 1.3vw;background:var(--soft);border-radius:calc(var(--u)*.9);border-inline-start:calc(var(--u)*.5) solid var(--brand)}
.msg.imp{background:#fff1ea;border-color:var(--accent);font-weight:700}
.msgs{display:flex;flex-direction:column;gap:1.2vh}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:1vw}
.big2 .box{text-align:center;padding:2.5vh 1vw}
.big2 .box .v{font-size:calc(var(--u)*2.9)}
.phone{text-align:center;font-size:calc(var(--u)*3);font-weight:800;color:var(--brand);direction:ltr}

/* ---------- סצנות מסך מלא ---------- */
.scene{display:flex;flex-direction:column;background:var(--panel);border-radius:calc(var(--u)*1.6);padding:3vh 2.5vw;box-shadow:0 .6vh 2.4vh rgba(20,60,95,.1);overflow:hidden}
.stitle{display:flex;align-items:center;gap:1.2vw;font-size:calc(var(--u)*3.2);font-weight:900;color:var(--brand);margin-bottom:2.5vh}
.stitle .ic{display:inline-block;animation:bob 3.5s ease-in-out infinite}
.stitle small{margin-inline-start:auto;font-size:calc(var(--u)*1.6);color:var(--muted);font-weight:500}

/* עכשיו / הבא */
.nn{flex:1;display:grid;grid-template-columns:3fr 2fr;gap:2vw;min-height:0}
.nn .p{border-radius:calc(var(--u)*1.4);padding:3vh 2vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1.5vh;position:relative;overflow:hidden}
.nn .cur{background:linear-gradient(160deg,#fff7ef,#ffe9d8);box-shadow:0 0 0 .3vw var(--accent) inset}
.nn .nx{background:var(--soft)}
.nn .lab{font-size:calc(var(--u)*2);font-weight:800;color:var(--accent);letter-spacing:.1vw}
.nn .nx .lab{color:var(--brand)}
.nn .ico{font-size:calc(var(--u)*9);line-height:1;animation:float 4s ease-in-out infinite}
.nn .nx .ico{font-size:calc(var(--u)*6)}
@keyframes float{50%{transform:translateY(-1.4vh)}}
.nn .tt{font-size:calc(var(--u)*4.4);font-weight:900;line-height:1.15}
.nn .nx .tt{font-size:calc(var(--u)*3.3)}
.nn .tm{font-size:calc(var(--u)*2.4);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.nn .bar{width:70%;height:1.3vh;background:rgba(226,112,58,.18);border-radius:1vh;overflow:hidden}
.nn .bar i{display:block;height:100%;background:var(--accent);border-radius:1vh}
.ring{position:relative;width:calc(var(--u)*13);height:calc(var(--u)*13)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:rgba(29,106,158,.15)}
.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset 1s}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*3.4);line-height:1}
.ring .num small{font-size:calc(var(--u)*1.4);color:var(--muted);font-weight:600;margin-top:.6vh}

/* ארוחות ותרופות */
.mm{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--u)*19),1fr));grid-auto-rows:1fr;gap:1.4vw;min-height:0}
.mc{--c:var(--meal);border-radius:calc(var(--u)*1.4);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;text-align:center;padding:2vh 1vw;border-bottom:calc(var(--u)*.6) solid var(--c);position:relative}
.mc .ic{font-size:calc(var(--u)*5.2);line-height:1}
.mc .tt{font-size:calc(var(--u)*2.3);font-weight:800}
.mc .tm{font-size:calc(var(--u)*4.2);font-weight:900;font-variant-numeric:tabular-nums;color:var(--c);direction:ltr}
.mc.past{opacity:.35;filter:grayscale(.6)}
.mc.next{background:#fff;box-shadow:0 0 0 .3vw var(--c) inset;animation:pulse 2.4s ease-in-out infinite}
.mc.next .ic{animation:float 3s ease-in-out infinite}
.mc .tag{position:absolute;top:1.4vh;inset-inline-end:1vw;background:var(--c);color:#fff;font-weight:800;font-size:calc(var(--u)*1.4);padding:.4vh .9vw;border-radius:2vw}
@keyframes pulse{50%{transform:scale(1.035)}}

/* הודעה גדולה */
.bigmsg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3vh;padding:0 4vw;position:relative}
.bigmsg .ic{font-size:calc(var(--u)*7);animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}
.bigmsg .tx{font-weight:800;line-height:1.35;color:var(--ink)}
.bigmsg.imp .tx{color:#b2401a}
.mslides{flex:1;position:relative}
.mslides>.bigmsg{position:absolute;inset:0;opacity:0;transform:scale(.94);transition:opacity .9s,transform .9s}
.mslides>.bigmsg.on{opacity:1;transform:none}
.mcount{position:absolute;bottom:0;left:0;right:0;text-align:center;color:var(--muted);font-size:calc(var(--u)*1.4)}

/* תמונות */
.photos{padding:0;background:#0d1b2a}
.ph{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.ph.on{opacity:1}
.ph .blur{position:absolute;inset:-5%;background-size:cover;background-position:center;filter:blur(30px) brightness(.55);transform:scale(1.1)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ph.on img{animation:kb var(--d,8s) ease-out both}
.ph:nth-child(even).on img{animation-name:kb2}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1%,-1%)}}
@keyframes kb2{from{transform:scale(1.09) translate(1%,1%)}to{transform:scale(1)}}
.ph .cap{position:absolute;bottom:4vh;left:0;right:0;text-align:center}
.ph .cap span{display:inline-block;background:rgba(0,0,0,.45);color:#fff;font-size:calc(var(--u)*2.6);font-weight:800;padding:1vh 2.2vw;border-radius:3vw}
.ph.on .cap span{animation:rise 1s .6s both}

/* חלקי היום */
.parts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw;min-height:0}
.part{background:var(--soft);border-radius:calc(var(--u)*1.4);padding:2vh 1.2vw;display:flex;flex-direction:column;gap:1vh;min-height:0;overflow:hidden}
.part.cur{background:#fff;box-shadow:0 0 0 .3vw var(--accent) inset}
.part h3{font-size:calc(var(--u)*2.6);font-weight:900;display:flex;align-items:center;gap:.8vw;margin-bottom:.8vh}
.part h3 .ic{font-size:calc(var(--u)*3.4)}
.part .it{display:flex;gap:.8vw;align-items:baseline;font-size:calc(var(--u)*1.85);padding:.7vh .8vw;border-radius:calc(var(--u)*.7);border-inline-start:calc(var(--u)*.4) solid var(--c,var(--other))}
.part .it b{font-variant-numeric:tabular-nums;min-width:calc(var(--u)*6)}
.part .it.past{opacity:.38}
.part .it.now{background:var(--now);font-weight:800}
.dayline{position:relative;height:1.4vh;background:rgba(29,106,158,.12);border-radius:1vh;margin:0 0 2.5vh}
.dayline i{position:absolute;top:0;bottom:0;inset-inline-start:0;background:linear-gradient(270deg,#f6c453,var(--accent));border-radius:1vh}
.dayline b{position:absolute;top:50%;margin-top:calc(var(--u)*-1.6);margin-inline-start:calc(var(--u)*-1.4);font-size:calc(var(--u)*2.6);animation:bob 3s ease-in-out infinite}

/* צוות */
.staffg{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*22),1fr));grid-auto-rows:min-content;gap:1.2vw;align-content:start;min-height:0;overflow:hidden}
.sc{display:flex;align-items:center;gap:1vw;background:var(--soft);border-radius:calc(var(--u)*1.2);padding:1.5vh 1vw}
.sc.key{background:#fff;box-shadow:0 0 0 .22vw var(--brand) inset}
.av{flex:none;width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:calc(var(--u)*2.4);background:hsl(var(--h),55%,48%)}
.sc .nm{font-size:calc(var(--u)*2);font-weight:800;line-height:1.2}
.sc .rl{font-size:calc(var(--u)*1.4);color:var(--muted)}
.sc .hr{font-size:calc(var(--u)*1.4);color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums}

/* ביקורים */
.visit{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2vw;align-items:stretch}
.visit .box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;text-align:center;border-radius:calc(var(--u)*1.4)}
.visit .box .ic{font-size:calc(var(--u)*6);animation:float 4s ease-in-out infinite}
.visit .box .l{font-size:calc(var(--u)*2.4);font-weight:800;color:var(--ink)}
.visit .box .v{font-size:calc(var(--u)*5);font-weight:900;color:var(--brand);direction:ltr}
.visit .box.open{background:#fff;box-shadow:0 0 0 .3vw var(--meal) inset}
.visit .box .st{font-size:calc(var(--u)*1.7);font-weight:800;color:var(--meal)}
.vphone{text-align:center;font-size:calc(var(--u)*3.6);font-weight:900;color:var(--brand);margin-top:2.5vh;direction:ltr}

/* שבת */
.shab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;text-align:center;background:radial-gradient(circle at 50% 30%,#fff8e6,transparent 60%)}
.candles{display:flex;gap:3vw;font-size:calc(var(--u)*8)}
.candles span{display:inline-block;animation:flick 1.8s ease-in-out infinite;transform-origin:bottom}
.candles span:nth-child(2){animation-delay:.6s}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.05,.97) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(2deg)}}
.shab .s2{font-size:calc(var(--u)*5);font-weight:900;color:#a36b00}
.shab .sub{font-size:calc(var(--u)*2.2);color:var(--muted);font-weight:700}
.shab .big2{width:70%}

/* התראת ארוחה/תרופה */
.alert{align-items:center;justify-content:center;text-align:center;gap:2.5vh;background:linear-gradient(160deg,#fff,var(--soft))}
.alert .ic{font-size:calc(var(--u)*13);line-height:1;animation:pop 1.8s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.12)}}
.alert .tt{font-size:calc(var(--u)*6.5);font-weight:900;color:var(--c)}
.alert .when{font-size:calc(var(--u)*3.6);font-weight:800;color:var(--ink)}
.alert .tm{font-size:calc(var(--u)*3);color:var(--muted);font-weight:700;direction:ltr}
.alert::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 .4vw var(--c) inset;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:1}100%{opacity:.2}}

/* ---------- תחתית ---------- */
footer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2vw;background:var(--panel);border-radius:calc(var(--u)*1.4);padding:0 2vw;box-shadow:0 .4vh 1.4vh rgba(20,60,95,.07)}
.quote{font-size:calc(var(--u)*2.15);font-weight:600;color:var(--brand2);transition:opacity 1.2s,transform 1.2s}
.quote.fade{opacity:0;transform:translateY(1vh)}
.contact{font-size:calc(var(--u)*1.5);color:var(--muted);text-align:end;line-height:1.4}
.contact b{color:var(--ink)}

/* ---------- לילה ---------- */
.night{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1c2f4f,#0a1324 70%);color:#dfe8f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;text-align:center;z-index:9;overflow:hidden}
.night[hidden]{display:none}
.night .st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.night .moon{font-size:calc(var(--u)*10);filter:drop-shadow(0 0 3vh rgba(255,230,150,.5));animation:float 6s ease-in-out infinite}
.night h1{font-size:calc(var(--u)*7.5);font-weight:900}
.night .nc{font-size:calc(var(--u)*4.2);font-variant-numeric:tabular-nums;opacity:.85}
.night p{font-size:calc(var(--u)*2.3);opacity:.8;max-width:70vw;line-height:1.5}
.night .ns{font-size:calc(var(--u)*1.6);opacity:.6}
.langs{display:inline-flex;gap:.4vw;margin-top:.4vh;direction:ltr}

function activeOn(it,d){
  const ds=ymd(d);
  if(it.start&&ds<it.start)return false;
  if(it.end&&ds>it.end)return false;
  if(it.rec==='weekly'&&!(it.days||[]).map(Number).includes(d.getDay()))return false;
  return true;
}

let DATA={items:[]},SHAB=null,WX=null,HEB={},HEB_DAY='',slideIdx=0,quoteIdx=0,SLIDES=[],mode='',D=null;

let ETAG='';
async function fetchRemote(){
  if(CFG.OWNER&&CFG.REPO){
    try{
      const h={Accept:'application/vnd.github.raw+json'};if(ETAG)h['If-None-Match']=ETAG;
      const r=await fetch(`https://api.github.com/repos/${CFG.OWNER}/${CFG.REPO}/contents/${CFG.DATA_PATH}?ref=${CFG.BRANCH}`,{headers:h,cache:'no-store'});
      if(r.status===304)return null;
      if(r.ok){ETAG=r.headers.get('ETag')||'';return await r.json();}
    }catch(e){}
    try{
      const r2=await fetch(`https://raw.githubusercontent.com/${CFG.OWNER}/${CFG.REPO}/${CFG.BRANCH}/${CFG.DATA_PATH}?t=${Date.now()}`,{cache:'no-store'});
      if(r2.ok)return await r2.json();
    }catch(e){}
  }
  const r3=await fetch(`${CFG.DATA_PATH}?t=${Date.now()}`,{cache:'no-store'});
  if(r3.ok)return await r3.json();
  throw 'no data';
}
async function loadData(){
  if(!CFG.TOKEN_ENC){
    let local=null;try{local=JSON.parse(safe.get('ward-demo')||'null')}catch(e){}
    if(local&&local.length){DATA={items:local};mode='demo';return;}
  }
  try{
    const j=await fetchRemote();
    if(j&&j.items){DATA=j;safe.set('ward-cache',JSON.stringify(j));}
    mode='';
  }catch(e){
    let c=null;try{c=JSON.parse(safe.get('ward-cache')||'null')}catch(_){}
    if(c){DATA=c;mode='offline';}
    else{DATA={items:demoItems()};mode='demo';}
  }
}

}
async function loadHebDate(){

    const j=await(await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${d.getFullYear()}&gm=${d.getMonth()+1}&gd=${d.getDate()}&g2h=1`)).json();
    HEB={he:(j.hebrew||'').replace(/[֑-ׇ]/g,''),en:`${j.hd} ${j.hm} ${j.hy}`};HEB_DAY=key;
  }catch(e){
    const f=l=>{try{return new Intl.DateTimeFormat(l,{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(_){return ''}};HEB={he:f('he-IL-u-ca-hebrew'),en:f('en-u-ca-hebrew')};
  }
}

function derive(now){
  const items=DATA.items||[],by=x=>items.filter(i=>i.type===x);
  const S=Object.assign({phone:'',visitMorning:'',visitEvening:'',sleepStart:'22:30',wakeTime:'06:30',scenes:null,langs:null},by('settings')[0]||{});
  LANGS=(Array.isArray(S.langs)&&S.langs.length?S.langs:ALL_LANGS).filter(l=>L[l]);
  const today=ymd(now),dow=now.getDay(),m=nowMin(now);
  const att=by('attendance').filter(a=>a.date===today);
  let staff=by('staff').filter(s=>s.active!==false).map(s=>{
    const a=att.find(x=>x.staffId===s.id);
    let present=(s.days||[]).map(Number).includes(dow),from=s.from,to=s.to;
    if(a){present=a.status==='in';if(a.from)from=a.from;if(a.to)to=a.to;}
    return Object.assign({},s,{present,from,to});
  }).filter(s=>s.present);
  att.filter(a=>!a.staffId&&a.status==='in').forEach(a=>staff.push({name:a.name,role:a.role,from:a.from,to:a.to}));
  staff=staff.filter(s=>{const f=toMin(s.from),e=toMin(s.to);if(f==null||e==null||e<=f)return true;return m<e;});
  let sched=by('schedule').filter(i=>activeOn(i,now));
  const vis=(v,key)=>{if(!v)return;const[a,b]=String(v).split(/[-–]/).map(x=>x.trim());if(a)sched.push({time:a,endTime:b,title:t(key),cat:'visit'});};
  vis(S.visitMorning,'vM');vis(S.visitEvening,'vE');
  if(S.sleepStart)sched.push({time:S.sleepStart,title:t('sleep'),cat:'rest',icon:'🌙'});
  sched=sched.map(i=>{const s=toMin(i.time);const e=i.endTime?toMin(i.endTime):s+30;return Object.assign({},i,{s,e})}).filter(i=>i.s!=null).sort((a,b)=>a.s-b.s);
  const msgs=by('message').filter(i=>activeOn(i,now)&&i.text).sort((a,b)=>(b.important?1:0)-(a.important?1:0));
  // משפטים: רק אלה שכתובים בשפה המוצגת
  let quotes=by('quote').filter(i=>activeOn(i,now)).map(q=>LANG==='he'?q.text:q['text_'+LANG]).filter(Boolean);
  if(!quotes.length)quotes=DEFAULT_QUOTES[LANG]||DEFAULT_QUOTES.he;
  const images=by('image').filter(i=>activeOn(i,now)&&i.url);
  const cur=sched.findIndex(r=>m>=r.s&&m<r.e),next=sched.findIndex(r=>r.s>m);
  return{S,staff,sched,msgs,quotes,images,m,cur,next};
}
const isDoc=s=>/רופא|מנהל|ד״ר|ד"ר/.test((s.role||'')+' '+(s.name||''));
const hrs=s=>s.from||s.to?`${esc(s.from||'')}–${esc(s.to||'')}`:'';
const icon=i=>esc(i.icon||(CATS[i.cat]||CATS.other)[0]);
const col=i=>(CATS[i.cat]||CATS.other)[1];
const title=i=>esc(tr(i,'title'));
const sname=s=>esc(tr(s,'name'));

/* ---------- לוח ראשי ---------- */
let schedSig='';
function renderSched(){
  const rows=D.sched,m=D.m,box=$('sched');
  if(!rows.length){const e=`<div class="empty">${t('noSched')}</div>`;if(schedSig!==e){box.innerHTML=e;schedSig=e;}return;}
  const focus=D.cur>=0?D.cur:(D.next>=0?D.next:rows.length-1);
  const start=Math.max(0,focus-1);
  const html=rows.slice(start,start+9).map((r,k)=>{
    const idx=start+k;let cls='row',b='';
    if(r.e<=m)cls+=' past';
    if(idx===D.cur){cls+=' now';b=t('now');}
    else if(idx===D.next){const d=r.s-m;if(d<=180){cls+=' next';b=inMins(d);}}
    return `<div class="${cls}" style="--c:${col(r)};--i:${k}"><div class="t">${esc(r.time)}${r.endTime?`<small>${t('until')} ${esc(r.endTime)}</small>`:''}</div><div class="ti">${icon(r)} ${title(r)}</div><div class="b">${b}</div></div>`;
  }).join('');
  if(html!==schedSig){
    schedSig=html;box.className='sched anim';box.innerHTML=html;
    const all=[...box.children],H=box.clientHeight;
    for(let i=all.length-1;i>2&&all[i].offsetTop+all[i].offsetHeight>H+2;i--)all[i].remove();
  }
  const nowRow=box.querySelector('.row.now');
  if(nowRow&&D.cur>=0){const r=rows[D.cur];nowRow.style.setProperty('--p',Math.min(100,Math.round((m-r.s)/Math.max(1,r.e-r.s)*100))+'%');}
}

function buildSlides(){
  const out=[],S=D.S;
  const docs=D.staff.filter(isDoc),others=D.staff.filter(s=>!isDoc(s));
  const head=tr(S,'headName'),sec=tr(S,'secretaryName');
  out.push(`<h2>🩺 ${t('docs')}</h2>
    <div class="kv">${head?`<div class="box"><div class="l">${t('head')}</div><div class="v">${esc(head)}</div></div>`:''}</div>
    <div class="list">${docs.length?docs.map(s=>`<div class="li"><b>${sname(s)}</b><span>${hrs(s)}</span></div>`).join(''):`<div class="empty">${t('noDocs')}</div>`}</div>`);
  if(others.length||sec)out.push(`<h2>👩‍⚕️ ${t('team')}</h2>
      ${sec?`<div class="kv"><div class="box"><div class="l">${t('secretary')}</div><div class="v">${esc(sec)}</div></div></div>`:''}
      <div class="chips">${others.map(s=>`<div class="chip">${sname(s)} <em>· ${esc(roleT(s.role))}${hrs(s)?' · '+hrs(s):''}</em></div>`).join('')}</div>`);
  for(let i=0;i<D.msgs.length;i+=3)out.push(`<h2>📣 ${t('msgs')}</h2><div class="msgs">${D.msgs.slice(i,i+3).map(x=>`<div class="msg${x.important?' imp':''}">${esc(tr(x,'text'))}</div>`).join('')}</div>`);
  const mm=D.sched.filter(i=>i.cat==='meal'||i.cat==='med');
  if(mm.length)out.push(`<h2>🍽️ ${t('mm')}</h2><div class="list">${mm.map(i=>`<div class="li" style="border-inline-start:.45vw solid ${col(i)}"><b>${icon(i)} ${title(i)}</b><span>${esc(i.time)}</span></div>`).join('')}</div>`);
  const ot=D.sched.filter(i=>i.cat==='ot'||i.cat==='group');
  if(ot.length)out.push(`<h2>🎨 ${t('ot')}</h2><div class="list">${ot.map(i=>`<div class="li"><b>${icon(i)} ${title(i)}</b><span>${esc(i.time)}${i.endTime?'–'+esc(i.endTime):''}</span></div>`).join('')}</div>`);
  const note=tr(S,'visitNote');
  if(S.visitMorning||S.visitEvening||S.phone)out.push(`<h2>🤝 ${t('visits')}</h2>
    <div class="big2"><div class="box"><div class="l">${t('morning')}</div><div class="v" dir="ltr">${esc(S.visitMorning||'—')}</div></div><div class="box"><div class="l">${t('evening')}</div><div class="v" dir="ltr">${esc(S.visitEvening||'—')}</div></div></div>
    ${note?`<div class="vnote" style="font-size:calc(var(--u)*1.7)">${esc(note)}</div>`:''}
    ${S.phone?`<div class="l" style="text-align:center;margin-top:3vh;color:var(--muted)">${t('phone')}</div><div class="phone">📞 ${esc(S.phone)}</div>`:''}`);
  return out;
}
function renderSlides(){
  const rot=$('rot');
  if(!SLIDES.length){rot.innerHTML='';return;}
  slideIdx%=SLIDES.length;
  rot.innerHTML=SLIDES.map((h,i)=>`<div class="slide${i===slideIdx?' on':''}">${h}</div>`).join('')+
    `<div class="dots">${SLIDES.map((_,i)=>`<i class="${i===slideIdx?'on':''}"></i>`).join('')}</div>`;
}
function nextSlide(){
  if(SLIDES.length<2)return;
  const sl=document.querySelectorAll('#rot .slide');
  slideIdx=(slideIdx+1)%SLIDES.length;
  sl.forEach((s,i)=>s.classList.toggle('on',i===slideIdx));
  document.querySelectorAll('#rot .dots i').forEach((s,i)=>s.classList.toggle('on',i===slideIdx));
}

/* ---------- סצנות מסך מלא ---------- */
const T=(ic,tt,sm)=>`<div class="stitle"><span class="ic">${ic}</span>${tt}${sm?`<small>${sm}</small>`:''}</div>`;
let photoIdx=0,msgIdx=0;
const SC={
  nownext(){
    const c=D.cur>=0?D.sched[D.cur]:null,n=D.next>=0?D.sched[D.next]:null,m=D.m;
    if(!c&&!n)return null;
    const curHtml=c?`<div class="lab">${t('now')}</div><div class="ico">${icon(c)}</div><div class="tt">${title(c)}</div>
      <div class="tm" dir="ltr">${esc(c.time)}${c.endTime?' – '+esc(c.endTime):''}</div><div class="bar"><i style="width:${Math.min(100,Math.round((m-c.s)/Math.max(1,c.e-c.s)*100))}%"></i></div>`
      :`<div class="lab">${t('now')}</div><div class="ico">🌿</div><div class="tt">${t('free')}</div><div class="tm">${t('freeSub')}</div>`;
    let nxHtml=`<div class="lab">${t('later')}</div><div class="ico">🌙</div><div class="tt">${t('done')}</div>`;
    if(n){const d=n.s-m,frac=Math.max(.04,1-Math.min(d,180)/180),C=2*Math.PI*54;
      nxHtml=`<div class="lab">${t('next')}</div><div class="ico">${icon(n)}</div><div class="tt">${title(n)}</div>
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="54"/><circle class="fg" cx="60" cy="60" r="54" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-frac)}"/></svg>
      <div class="num">${esc(n.time)}<small>${inMins(d)}</small></div></div>`;}
    return{html:T('⏰',t('whatNow'))+`<div class="nn anim"><div class="p cur">${curHtml}</div><div class="p nx" style="--i:1">${nxHtml}</div></div>`,
      after(el){setTimeout(()=>el.querySelectorAll('.ring .fg').forEach(c=>c.style.strokeDashoffset=c.dataset.off),400);}};
  },
  meals(){
    const mm=D.sched.filter(i=>i.cat==='meal'||i.cat==='med');
    if(!mm.length)return null;
    const m=D.m,nx=mm.findIndex(i=>i.e>m);
    return{html:T('🍽️',t('mmToday'))+`<div class="mm anim">${mm.map((i,k)=>{
      let cls='mc',tag='';
      if(i.e<=m)cls+=' past';
      else if(k===nx){cls+=' next';tag=m>=i.s?t('now'):inMins(i.s-m);}
      return `<div class="${cls}" style="--c:${col(i)};--i:${k}">${tag?`<div class="tag">${tag}</div>`:''}<div class="ic">${icon(i)}</div><div class="tt">${title(i)}</div><div class="tm">${esc(i.time)}</div></div>`;}).join('')}</div>`};
  },
  messages(){
    if(!D.msgs.length)return null;
    const n=Math.min(3,D.msgs.length),list=[];
    for(let k=0;k<n;k++)list.push(D.msgs[(msgIdx+k)%D.msgs.length]);
    msgIdx=(msgIdx+n)%D.msgs.length;
    const size=x=>x.length<40?6.2:x.length<90?4.8:x.length<170?3.7:2.9;
    return{dur:n*CFG.MSG_SECONDS,html:T('📣',t('msgsT'),D.msgs.length>1?t('nMsgs')(D.msgs.length):'')+`<div class="mslides">${list.map((x,k)=>{const tx=tr(x,'text');
      return `<div class="bigmsg${x.important?' imp':''}${k===0?' on':''}"><div class="ic">${x.important?'❗':'💬'}</div><div class="tx" style="font-size:calc(var(--u)*${size(tx)})">${esc(tx)}</div></div>`;}).join('')}</div>`,
      after(el){const s=el.querySelectorAll('.bigmsg');let i=0;if(s.length>1)sceneTimers.push(setInterval(()=>{s[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on');},CFG.MSG_SECONDS*1000));}};
  },
  photos(){
    const im=D.images;if(!im.length)return null;
    const n=Math.min(CFG.PHOTOS_PER_ROUND,im.length),list=[];
    for(let k=0;k<n;k++)list.push(im[(photoIdx+k)%im.length]);
    photoIdx=(photoIdx+n)%im.length;
    preloadPhotos();
    return{cls:'photos',dur:n*CFG.PHOTO_SECONDS,html:list.map((p,k)=>{const cap=tr(p,'caption');
      return `<div class="ph${k===0?' on':''}" style="--d:${CFG.PHOTO_SECONDS+2}s"><div class="blur" style="background-image:url('${esc(bgUrl(p.url))}')"></div>${imgTag(p.url)}${cap?`<div class="cap"><span>${esc(cap)}</span></div>`:''}</div>`;}).join(''),
      after(el){const s=el.querySelectorAll('.ph');let i=0;if(s.length>1)sceneTimers.push(setInterval(()=>{s[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on');},CFG.PHOTO_SECONDS*1000));}};
  },
  dayparts(){
    if(!D.sched.length)return null;
    const m=D.m,P=[['morning','🌅',0,12*60],['noon','☀️',12*60,17*60],['evening','🌙',17*60,24*60]];
    const wake=toMin(D.S.wakeTime)||360,sleep=toMin(D.S.sleepStart)||1350,pct=Math.max(0,Math.min(100,(m-wake)/(sleep-wake)*100));
    return{html:T('🗓️',t('dayT'))+`<div class="dayline"><i style="width:${pct}%"></i><b style="inset-inline-start:${pct}%">${m<17*60?'☀️':'🌙'}</b></div>
      <div class="parts anim">${P.map(([nm,ic,a,b],k)=>{
        const its=D.sched.filter(i=>i.s>=a&&i.s<b);
        return `<div class="part${m>=a&&m<b?' cur':''}" style="--i:${k}"><h3><span class="ic">${ic}</span>${t(nm)}</h3>${its.map(i=>
          `<div class="it${i.e<=m?' past':''}${m>=i.s&&m<i.e?' now':''}" style="--c:${col(i)}"><b>${esc(i.time)}</b><span>${icon(i)} ${title(i)}</span></div>`).join('')||'<div class="empty">—</div>'}</div>`;}).join('')}</div>`};
  },
  staff(){
    const S=D.S,st=D.staff.slice().sort((a,b)=>(isDoc(b)?1:0)-(isDoc(a)?1:0));
    if(!st.length&&!S.headName&&!S.secretaryName)return null;
    const card=(nm,rl,h,key,k)=>`<div class="sc${key?' key':''}" style="--i:${k}"><div class="av" style="--h:${hue(nm)}">${esc(initial(nm))}</div><div><div class="nm">${esc(nm)}</div><div class="rl">${esc(rl)}</div>${h?`<div class="hr">${h}</div>`:''}</div></div>`;
    const cards=[];
    if(S.headName&&!st.some(s=>s.name===S.headName))cards.push(card(tr(S,'headName'),t('head'),'',1,0));
    if(S.secretaryName&&!st.some(s=>s.name===S.secretaryName))cards.push(card(tr(S,'secretaryName'),t('secretary'),'',1,cards.length));
    st.forEach(s=>cards.push(card(tr(s,'name'),roleT(s.role),hrs(s),s.name===S.headName||s.name===S.secretaryName,cards.length)));
    return{html:T('👩‍⚕️',t('staffT'),st.length?t('nStaff')(st.length):'')+`<div class="staffg anim">${cards.join('')}</div>`};
  },
  visits(){
    const S=D.S;if(!S.visitMorning&&!S.visitEvening)return null;
    const open=v=>{if(!v)return false;const[a,b]=String(v).split(/[-–]/).map(x=>toMin(x.trim()));return a!=null&&b!=null&&D.m>=a&&D.m<b;};
    const box=(l,ic,v,k)=>`<div class="box${open(v)?' open':''}" style="--i:${k}"><div class="ic">${ic}</div><div class="l">${l}</div><div class="v">${esc(v||'—')}</div>${open(v)?`<div class="st">${t('open')}</div>`:''}</div>`;
    const note=tr(S,'visitNote');
    return{html:T('🤝',t('visits'))+`<div class="visit anim">${box(t('morning'),'🌤️',S.visitMorning,0)}${box(t('evening'),'🌆',S.visitEvening,1)}</div>${note?`<div class="vnote">${esc(note)}</div>`:''}${S.phone?`<div class="vphone">📞 ${esc(S.phone)}</div>`:''}`};
  },
  shabbat(){
    const now=new Date(),dow=now.getDay();
    if(!SHAB||!SHAB.in||!(dow===5||dow===6||(dow===4&&now.getHours()>=12))||(SHAB.out&&now>SHAB.out))return null;
    return{html:`<div class="shab anim"><div class="candles"><span>🕯️</span><span>🕯️</span></div><div class="s2" style="--i:1">${t('shabbat')}</div>
      ${SHAB.parasha&&LANG==='he'?`<div class="sub" style="--i:2">${esc(SHAB.parasha)}</div>`:''}
      <div class="big2" style="--i:3"><div class="box"><div class="l">${t('shIn')}</div><div class="v">${hm(SHAB.in)}</div></div><div class="box"><div class="l">${t('shOut')}</div><div class="v">${SHAB.out?hm(SHAB.out):'—'}</div></div></div></div>`};
  },
  alert(){
    const a=alertItem();if(!a)return null;
    const d=a.s-D.m;
    return{cls:'alert',dur:12,html:`<div class="ic">${icon(a)}</div><div class="tt" style="--c:${col(a)}">${title(a)}</div><div class="when">${d>0?inMins(d):t('nowX')}</div><div class="tm">${esc(a.time)}${a.endTime?' – '+esc(a.endTime):''}</div>`,style:`--c:${col(a)}`};
  }
};
function alertItem(){return D.sched.find(i=>(i.cat==='meal'||i.cat==='med')&&D.m>=i.s-10&&D.m<Math.min(i.e,i.s+15))||null;}

/* ---------- שפה ---------- */
function setLang(l){
  if(l===LANG)return false;
  LANG=l;
  document.documentElement.lang=l;
  document.documentElement.dir=l==='en'?'ltr':'rtl';
  schedSig='';SLIDES=[];slideIdx=0;
  document.body.classList.remove('swap');void document.body.offsetWidth;document.body.classList.add('swap');
  if(D)quoteIdx=0;
  return true;
}
function nextLang(){langIdx=(langIdx+1)%LANGS.length;return LANGS[langIdx];}

/* ---------- מנוע ההחלפה ---------- */
let view='dash',sceneIdx=-1,lastAlert=0,viewTimer=null,sceneTimers=[];
function clearSceneTimers(){sceneTimers.forEach(clearInterval);sceneTimers=[];}
function runBar(sec){const b=$('sbar');b.style.transition='none';b.style.width='0';void b.offsetWidth;b.style.transition=`width ${sec}s linear`;b.style.width='100%';}
function showDash(){
  clearTimeout(viewTimer);clearSceneTimers();view='dash';
  $('v-scene').classList.remove('on');$('v-dash').classList.add('on');
  runBar(CFG.DASH_SECONDS);viewTimer=setTimeout(advance,CFG.DASH_SECONDS*1000);
}
function showScene(name){
  const sc=SC[name]&&SC[name]();if(!sc)return false;
  clearTimeout(viewTimer);clearSceneTimers();view=name;
  const el=$('v-scene');
  el.className='view scene '+(sc.cls||'');el.setAttribute('style',sc.style||'');el.innerHTML=sc.html;
  $('v-dash').classList.remove('on');
  requestAnimationFrame(()=>el.classList.add('on'));
  if(sc.after)sc.after(el);
  const dur=sc.dur||CFG.SCENE_SECONDS;
  runBar(dur);viewTimer=setTimeout(advance,dur*1000);
  return true;
}
function advance(){
  clearTimeout(viewTimer);
  D=derive(new Date());
  if(!$('night').hidden){showDash();return;}
  if(view!=='dash'){
    // חוזרים למסך הראשי – ובזמן שהוא מוסתר מחליפים שפה
    if(setLang(nextLang()))renderAll();
    showDash();return;
  }
  if(alertItem()&&Date.now()-lastAlert>50000&&showScene('alert')){lastAlert=Date.now();return;}
  const S=D.S,list=(Array.isArray(S.scenes)?S.scenes:SCENES).filter(k=>SC[k]);
  for(let k=1;k<=list.length;k++){
    const idx=(sceneIdx+k)%list.length;
    if(showScene(list[idx])){sceneIdx=idx;return;}
  }
  if(setLang(nextLang()))renderAll();
  showDash();
}
const PRE={};
function preloadPhotos(){
  const im=D.images;for(let k=0;k<Math.min(CFG.PHOTOS_PER_ROUND,im.length);k++){const u=bgUrl(im[(photoIdx+k)%im.length].url);if(!PRE[u]){PRE[u]=new Image();PRE[u].src=u;}}
}

function inNight(now,S){
  const s=toMin(S.sleepStart),w=toMin(S.wakeTime);if(s==null||w==null)return false;
  const m=nowMin(now);return s>w?(m>=s||m<w):(m>=s&&m<w);
}
function stars(){const n=$('night');for(let i=0;i<60;i++){const s=document.createElement('i');s.className='st';s.style.cssText=`top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${(Math.random()*3).toFixed(2)}s;opacity:${(.3+Math.random()*.7).toFixed(2)}`;n.appendChild(s);}}

function renderAll(){
  const now=new Date();D=derive(now);
  if(!LANGS.includes(LANG)){langIdx=0;setLang(LANGS[0]);D=derive(now);}
  const S=D.S,h=now.getHours();
  const night=inNight(now,S);
  if(night){const nl=LANGS[Math.floor(Date.now()/20000)%LANGS.length];if(setLang(nl))D=derive(now);}
  document.body.dataset.tod=h>=5&&h<11?'morning':h>=17||h<5?'evening':'day';
  $('gdate').textContent=now.toLocaleDateString(LOCALE[LANG],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('hdate').textContent=subDate(now);
  $('ward').textContent=tr(S,'wardName');
  $('schedT').textContent=t('sched');
  $('wx').innerHTML=WX?`<span>${WXI(WX.c)}</span> ${WX.t}°`:'';
  let sh='';
  if(SHAB&&SHAB.in&&SHAB.out)sh=(now>=SHAB.in&&now<SHAB.out)?`🕯️ ${t('shabbat')} · ${t('hOut')} ${hm(SHAB.out)}`:`🕯️ ${t('hIn')} ${hm(SHAB.in)} · ${t('hOut')} ${hm(SHAB.out)}`;
  $('shab').textContent=sh;
  $('langs').innerHTML=LANGS.length>1?LANGS.map(l=>`<b class="${l===LANG?'on':''}">${{he:'עב',ar:'عر',en:'EN'}[l]}</b>`).join(''):'';
  const parts=[];
  if(S.phone)parts.push(`📞 ${t('phone')}: <b dir="ltr">${esc(S.phone)}</b>`);
  if(S.secretaryName)parts.push(`${t('secShort')}: <b>${esc(tr(S,'secretaryName'))}</b>`);
  $('contact').innerHTML=parts.join('<br>');
  renderSched();
  const ns=buildSlides();
  if(ns.join('|')!==SLIDES.join('|')){SLIDES=ns;renderSlides();}
  if(night&&view!=='dash')showDash();
  $('night').hidden=!night;
  if(night){
    $('ngt').textContent=t('night');
    $('nmsg').textContent=tr(S,'nightMessage')||t('nightMsg');
    $('nsub').textContent=`${t('rest')} ${S.sleepStart}–${S.wakeTime}`+(S.phone?` · ${t('phone')} ${S.phone}`:'');
  }
  if(!$('quote').textContent||$('quote').dataset.l!==LANG){$('quote').dataset.l=LANG;quoteIdx=0;$('quote').textContent='🌿 '+D.quotes[0];}
  $('demo').textContent=mode?t(mode):'';
}
function tick(){
  const now=new Date(),tm=`${pad(now.getHours())}<span class="c">:</span>${pad(now.getMinutes())}`;
  if($('clock').dataset.t!==tm){$('clock').innerHTML=tm;$('clock').dataset.t=tm;$('nclock').textContent=hm(now);}
}
function rotateQuote(){
  if(!D)return;const q=$('quote');q.classList.add('fade');
  setTimeout(()=>{quoteIdx=(quoteIdx+1)%D.quotes.length;q.textContent='🌿 '+D.quotes[quoteIdx];q.classList.remove('fade');},1200);
}

(async function start(){
  tick();stars();await loadData();renderAll();
  loadHebDate().then(renderAll);loadShabbat().then(renderAll);loadWeather().then(renderAll);
  showDash();
  setInterval(tick,1000);
  setInterval(renderAll,20000);
  setInterval(nextSlide,CFG.ROTATE_SECONDS*1000);
  setInterval(rotateQuote,CFG.QUOTE_SECONDS*1000);
  setInterval(async()=>{await loadData();renderAll();},CFG.REFRESH_SECONDS*1000);
  setInterval(()=>{loadHebDate();loadWeather();},30*60*1000);
  setInterval(loadShabbat,6*3600*1000);
  setTimeout(()=>location.reload(),6*3600*1000);
})();
